name: OPA
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Setup OPA
      uses: open-policy-agent/setup-opa@v2
      with:
        version: latest

    # Upstream sample folders. Kept non-blocking: most of them are pre-1.0 Rego
    # (`deny[msg] { ... }` with no `if` / `contains`), which OPA 1.x refuses to parse, while
    # external_data/random_decision is 1.x syntax that pre-1.0 OPA refuses to parse. No
    # single OPA version reads the whole set, so this step is informational until someone
    # migrates them. It has nothing to do with the SCALRCORE-38740 fixture below.
    - name: Run OPA Tests (upstream samples, informational)
      continue-on-error: true
      run: |
        dirs=$(find . -type f -name '*.rego' -not -path './pia-*' -exec dirname {} \; | sort -u)
        echo "Directories to be tested:"
        for dir in $dirs; do echo "$dir"; done
        for dir in $dirs; do
            echo "Running tests in $dir"
            opa test "$dir/" -v --format pretty || echo "Tests failed in $dir"
        done

    # The SCALRCORE-38740 fixture. This step IS blocking.
    #
    # Each policy is checked on its own against pia-common, never as one bundle. That
    # mirrors how Scalr evaluates them: policy_check.check (taco/app/policy/service/
    # policy_check.py:117-120) uploads one module, evaluates data.terraform.deny, then
    # removes it before the next.
    #
    # Checking them together would fail, and the failure would be an artifact of the test
    # harness rather than a real defect: every policy declares `package terraform`, so
    # `allowed` in allowed_resource_types.rego collides with `allowed` in
    # require_provider_allowlist.rego, and work/offset/hits collide five ways across
    # slow_scan_1..5. Isolated uploads make that legal, and real customer policy repos rely
    # on it.
    - name: Check SCALRCORE-38740 fixture
      run: |
        fail=0

        echo "== manifest keys vs files =="
        keys=$(grep -oE '^policy "[^"]+"' pia-repro/scalr-policy.hcl | sed 's/policy "//; s/"//')
        for k in $keys; do
          [ -f "pia-repro/${k}.rego" ] || { echo "  MISSING pia-repro/${k}.rego"; fail=1; }
        done
        for f in pia-repro/*.rego; do
          n=$(basename "$f" .rego)
          grep -q "^policy \"${n}\"" pia-repro/scalr-policy.hcl \
            || { echo "  ORPHAN $f is not in the manifest"; fail=1; }
        done
        echo "  $(echo "$keys" | wc -w) manifest entries checked"

        echo "== opa check, one policy at a time + pia-common =="
        for f in pia-repro/*.rego; do
          if opa check "$f" pia-common/ >/dev/null 2>&1; then
            echo "  ok    $(basename "$f")"
          else
            echo "  FAIL  $(basename "$f")"
            opa check "$f" pia-common/ 2>&1 | sed 's/^/        /'
            fail=1
          fi
        done

        echo "== opa eval against both fixtures =="
        for input in pia-repro/testdata/input-*.json; do
          echo "  --- $(basename "$input") ---"
          for f in pia-repro/*.rego; do
            n=$(basename "$f" .rego)
            # Skipped: calls http.send against random.org. It is enabled = false in the
            # manifest, but this loop walks every file, and CI should not depend on a
            # third-party endpoint. `opa check` above still validates its syntax.
            [ "$n" = "nondeterministic_http" ] && { echo "      skip    $n (network)"; continue; }
            out=$(opa eval --format json --data "$f" --data pia-common/ \
                    --input "$input" 'data.terraform.deny' 2>&1) || {
              echo "      ERROR $n"; echo "$out" | head -3 | sed 's/^/        /'; fail=1; continue; }
            c=$(echo "$out" | jq -r '[.result[0].expressions[0].value // []] | flatten | length')
            [ "$c" = "0" ] && echo "      pass    $n" || echo "      deny($c) $n"
          done
        done

        exit $fail
